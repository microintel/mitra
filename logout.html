<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log out — Mitra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<style>
:root{
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --bg:#F7F8F1; --surface:#FFFFFF;
  --ink:#151F19; --ink-soft:#4C594F; --muted:#818C82; --line:rgba(18,28,20,.10);
  --teal:#149164; --teal-dark:#0D7350; --teal-tint:#E1F3E9;
  --coral:#F2792E;
  --on-brand:#FFFFFF;
  --grad-hero: radial-gradient(120% 140% at 100% 0%, var(--teal-tint) 0%, var(--bg) 45%, var(--bg) 100%);
  --grad-brand: linear-gradient(135deg,#0D7350 0%, #149164 55%, #E7A431 130%);
  --shadow-lg: 0 24px 48px -12px rgba(18,28,20,.22);
  --r-xl:28px;
}
[data-theme="dark"]{
  --bg:#0B120D; --surface:#16211A;
  --ink:#E7F0E9; --ink-soft:#B4C4B8; --muted:#7C8B80; --line:rgba(230,240,232,.10);
  --teal:#3FCB93; --teal-dark:#2AA877; --teal-tint:rgba(63,203,147,.16);
  --coral:#FF9B54;
  --on-brand:#FFFFFF;
  --grad-hero: var(--bg);
  --grad-brand: linear-gradient(135deg,#2AA877 0%, #3FCB93 55%, #F6C567 130%);
  --shadow-lg: 0 24px 48px -12px rgba(0,0,0,.6);
}
[data-accent="ocean"]{ --teal:#1477A6; --teal-dark:#0F5F87; --teal-tint:#E2F1F8; --grad-brand: linear-gradient(135deg,#0F5F87 0%, #1477A6 55%, #E7A431 130%); }
[data-accent="ocean"][data-theme="dark"]{ --teal:#4FB8E0; --teal-dark:#2E9BC4; --teal-tint:rgba(79,184,224,.16); --grad-brand: linear-gradient(135deg,#2E9BC4 0%, #4FB8E0 55%, #F6C567 130%); }
[data-accent="plum"]{ --teal:#8B4FBF; --teal-dark:#723FA0; --teal-tint:#F2EAFA; --grad-brand: linear-gradient(135deg,#723FA0 0%, #8B4FBF 55%, #E7A431 130%); }
[data-accent="plum"][data-theme="dark"]{ --teal:#B98CF0; --teal-dark:#9E6BDE; --teal-tint:rgba(185,140,240,.16); --grad-brand: linear-gradient(135deg,#9E6BDE 0%, #B98CF0 55%, #F6C567 130%); }
[data-accent="terracotta"]{ --teal:#C1592D; --teal-dark:#9E4522; --teal-tint:#FBEBE1; --grad-brand: linear-gradient(135deg,#9E4522 0%, #C1592D 55%, #E7A431 130%); }
[data-accent="terracotta"][data-theme="dark"]{ --teal:#E88656; --teal-dark:#D06B3B; --teal-tint:rgba(232,134,86,.16); --grad-brand: linear-gradient(135deg,#D06B3B 0%, #E88656 55%, #F6C567 130%); }
[data-accent="berry"]{ --teal:#B0295A; --teal-dark:#8E1D47; --teal-tint:#FBE7EF; --grad-brand: linear-gradient(135deg,#8E1D47 0%, #B0295A 55%, #E7A431 130%); }
[data-accent="berry"][data-theme="dark"]{ --teal:#F0679A; --teal-dark:#DB4880; --teal-tint:rgba(240,103,154,.16); --grad-brand: linear-gradient(135deg,#DB4880 0%, #F0679A 55%, #F6C567 130%); }
[data-accent="slate"]{ --teal:#445048; --teal-dark:#333D37; --teal-tint:#E9ECE9; --grad-brand: linear-gradient(135deg,#333D37 0%, #445048 55%, #E7A431 130%); }
[data-accent="slate"][data-theme="dark"]{ --teal:#9DAFA3; --teal-dark:#7E9188; --teal-tint:rgba(157,175,163,.16); --grad-brand: linear-gradient(135deg,#7E9188 0%, #9DAFA3 55%, #F6C567 130%); }
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--grad-hero); color:var(--ink);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:28px 18px;
}
h1{font-family:var(--font-display); margin:0; font-weight:600; font-size:1.5rem;}
p{margin:0;}
a{color:inherit; text-decoration:none;}
:focus-visible{outline:2.5px solid var(--coral); outline-offset:3px; border-radius:6px;}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl); box-shadow:var(--shadow-lg); padding:40px 32px; text-align:center; max-width:380px; width:100%;}
.icon-circle{width:64px; height:64px; border-radius:50%; background:var(--teal-tint); color:var(--teal-dark); display:flex; align-items:center; justify-content:center; font-size:1.8rem; margin:0 auto 18px;}
.icon-circle.loading{background:var(--bg-soft, #EDF0E2);}
.sub{color:var(--muted); font-size:.92rem; margin-top:10px; line-height:1.5;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:.9rem; padding:12px 22px; border-radius:999px; background:var(--grad-brand); color:var(--on-brand); margin-top:24px;}
.spin{animation:spin 1s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body data-theme="light">
<div class="card">
  <div class="icon-circle" id="iconCircle"><i class="bi bi-arrow-repeat spin" aria-hidden="true"></i></div>
  <h1 id="statusTitle">Logging you out…</h1>
  <p class="sub" id="statusSub">Just a moment.</p>
  <a href="login.html" class="btn" id="loginLink" style="display:none;">
    <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Go to login
  </a>
</div>

<script src="mitra-auth.js"></script>
<script>
(function(){
  "use strict";

  // Match the theme saved in the shared "mitrami" IndexedDB.
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  MitraAuth.getTheme().then(function(saved){
    document.body.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  });
  MitraAuth.applySavedAccent();

  var iconCircle = document.getElementById('iconCircle');
  var statusTitle = document.getElementById('statusTitle');
  var statusSub = document.getElementById('statusSub');
  var loginLink = document.getElementById('loginLink');

  MitraAuth.logout().then(function(){
    iconCircle.innerHTML = '<i class="bi bi-check-lg" aria-hidden="true"></i>';
    statusTitle.textContent = "You've been logged out";
    statusSub.textContent = 'Redirecting you to the login page…';
    loginLink.style.display = 'inline-flex';
    setTimeout(function(){ window.location.href = 'login.html'; }, 1800);
  }).catch(function(err){
    iconCircle.innerHTML = '<i class="bi bi-exclamation-triangle" aria-hidden="true"></i>';
    statusTitle.textContent = 'Could not log out';
    statusSub.textContent = err.message || 'Something went wrong. Please try again.';
    loginLink.style.display = 'inline-flex';
  });
})();
</script>
</body>
</html>
