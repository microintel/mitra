<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories — Learn &amp; Quiz</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Minimal scoped styles for the new search-clear button and fallback thumb.
     Safe to remove/replace once equivalent rules exist in style.css instead. */
  .search-row{ position:relative; }
  .search-row #searchBox{ padding-right:2.25em; box-sizing:border-box; width:100%; }
  .search-clear{
    position:absolute; right:0.5em; top:50%; transform:translateY(-50%);
    border:none; background:transparent; cursor:pointer; font-size:1.1em;
    line-height:1; padding:0.2em 0.4em; color:inherit; opacity:0.6; display:none;
  }
  .search-clear:hover{ opacity:1; }
  .cat-thumb{ position:relative; display:flex; align-items:center; justify-content:center; font-size:3.5em; line-height:1; }
  .cat-serial{
    position:absolute; top:0.4em; left:0.4em;
    background:rgba(0,0,0,0.65); color:#fff; font-size:0.75em;
    min-width:1.6em; text-align:center; line-height:1.6em;
    border-radius:999px; padding:0 0.4em; pointer-events:none;
  }
</style>
<script src="../mitra-auth.js"></script>
</head>
<body>

<header>
  <div class="header-bar">
    <span></span>
    <div class="header-controls">
      <button class="icon-btn" id="themeToggle" aria-label="Switch to dark theme" aria-pressed="false">
        <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" fill="currentColor" style="display:none;"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <div style="position:relative;">
        <button class="icon-btn" id="accentBtn" aria-label="Choose accent color" aria-expanded="false" aria-haspopup="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="14" cy="8.5" r="1.3" fill="currentColor"/><circle cx="16" cy="13" r="1.3" fill="currentColor"/></svg>
        </button>
        <div class="accent-panel" id="accentPanel" role="dialog" aria-label="Accent color">
          <div class="accent-panel-title">Accent color</div>
          <div class="accent-swatches" id="accentSwatches"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="eyebrow">Pick a Topic</div>
  <h1>Learn &amp; Quiz</h1>
  <p>Choose a category to start browsing and testing yourself</p>
</header>

<main class="cat-main">
  <div class="search-row">
    <input type="text" id="searchBox" placeholder="Search categories…" aria-label="Search categories">
    <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">✕</button>
  </div>
  <div class="cat-note" id="catNote" role="status" aria-live="polite">Loading categories…</div>
  <div class="cat-grid" id="catGrid"></div>
</main>

<script>
/* ==================================================================
   categories.json shape:
   [
     { "name": "Vegetables", "emoji": "🥕", "location": "vegetables.json" },
     { "name": "Fruits",     "emoji": "🍎", "location": "fruits.json" },
     ...
   ]

   Clicking a card opens categories.html?data=<location>, so categories.html
   loads that topic's data file (see the DATA_FILE param in categories.html).
   ================================================================== */

const catGrid = document.getElementById('catGrid');
const catNote = document.getElementById('catNote');
const searchBox = document.getElementById('searchBox');
const searchClear = document.getElementById('searchClear');

let allCategories = [];
let completedSet = new Set();

async function loadCompletedSet(){
  if(typeof MitraAuth === 'undefined') return;
  try{
    const completed = await MitraAuth.getCompletedCategories();
    completedSet = new Set(completed.map(r => r.location));
  }catch(e){ /* IndexedDB unavailable — badges just won't show */ }
}

async function loadCategories(){
  catNote.textContent = 'Loading categories…';
  try{
    const res = await fetch('cats/categories.json');
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    allCategories = await res.json();
    if(!Array.isArray(allCategories) || allCategories.length === 0){
      catNote.textContent = 'No categories found in cats/categories.json.';
      catGrid.innerHTML = '';
      return;
    }
    await loadCompletedSet();
    renderCategories(allCategories);
  }catch(e){
    catNote.textContent = 'Could not load cats/categories.json — make sure the cats folder is present.';
    catGrid.innerHTML = '';
  }
}

function renderCategories(categories){
  const doneCount = allCategories.filter(c => completedSet.has(c.location)).length;
  catNote.textContent = categories.length
    ? `${categories.length} categories · ${doneCount}/${allCategories.length} completed`
    : 'No categories match your search';
  catGrid.innerHTML = '';
  categories.forEach(cat => {
    // Serial number reflects the category's position in the original,
    // unfiltered list (allCategories) so it stays stable while searching.
    const serial = allCategories.indexOf(cat) + 1;
    const isComplete = completedSet.has(cat.location);
    const a = document.createElement('a');
    a.className = 'cat-card' + (isComplete ? ' completed' : '');
    a.href = `categories.html?data=${encodeURIComponent(cat.location)}`;
    a.innerHTML = `
      <div class="cat-thumb">
        <span class="cat-serial">${serial}</span>
        <span class="cat-complete-badge" aria-hidden="true">✓</span>
        <span class="cat-emoji" aria-hidden="true">${cat.emoji}</span>
      </div>
      <div class="cat-label">${cat.name}</div>`;
    catGrid.appendChild(a);
  });
}

function applySearch(){
  const q = searchBox.value.trim().toLowerCase();
  searchClear.style.display = q ? 'block' : 'none';
  const filtered = q
    ? allCategories.filter(cat => cat.name.toLowerCase().includes(q))
    : allCategories;
  renderCategories(filtered);
}

searchBox.addEventListener('input', applySearch);

searchClear.addEventListener('click', () => {
  searchBox.value = '';
  searchBox.focus();
  applySearch();
});

loadCategories();

if(typeof MitraAuth !== 'undefined'){
  MitraAuth.initThemeToggle();
  MitraAuth.initAccentPicker();
  // Keep badges in sync if the user marks/unmarks a category, comes back
  // via the back button, or has this page open in another tab.
  MitraAuth.onProgressChange(async () => {
    await loadCompletedSet();
    applySearch();
  });
  document.addEventListener('visibilitychange', async () => {
    if(document.visibilityState === 'visible'){
      await loadCompletedSet();
      applySearch();
    }
  });
}
</script>
</body>
</html>
